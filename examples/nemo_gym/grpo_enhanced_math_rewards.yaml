# Enhanced Math Rewards Configuration
# This config enables multi-component scoring and difficulty scaling
# Based on grpo_nanov3.yaml with enhanced reward features

defaults:
  - grpo_nanov3

# Override environment settings to enable enhanced math rewards
env:
  nemo_gym:
    math_with_judge:
      resources_servers:
        math_with_judge:
          judge_model_server:
            name: policy_model  # Use policy model as judge
          should_use_judge: true  # Enable LLM judge for multi-component scoring
          
          # Multi-component reward weights
          format_weight: 0.1      # Reward for <think> and \boxed{} tags
          outcome_weight: 2.0     # Reward for correct answer (scaled by difficulty)
          axiom_weight: 0.1       # Reward for reasoning tags [Axiom], [Def], etc.
          coherence_weight: 0.2   # Reward for logical reasoning flow
          relevance_weight: 0.1   # Reward for addressing the problem
          efficiency_weight: 0.05 # Reward for concise reasoning
          
          # Difficulty scaling settings
          use_difficulty_scaling: true  # Enable difficulty-based reward scaling
          difficulty_scaling_cap: 4.0   # Max multiplier for hard problems
          
          # Trace logging for analysis
          save_traces: true
          trace_dir: "logs/training_traces"  # Will be created automatically
          
          judge_responses_create_params:
            input: []
            max_new_tokens: 512
            temperature: 0.1  # Low temperature for consistent judge evaluations

# Data paths - update these to your dataset
data:
  # For standard format (backward compatible):
  # {"question": "...", "expected_answer": "..."}
  train_jsonl_fpath: "/path/to/your/train.jsonl"
  validation_jsonl_fpath: "/path/to/your/validation.jsonl"
  
  # For enhanced format with difficulty scaling:
  # {"question": "...", "expected_answer": "...", "llama8b_solve_rate": 0.3, "domain": "...", "source": "..."}

# Training settings (adjust based on your hardware)
training:
  num_training_steps: 1000
  gradient_accumulation_steps: 1
  
# Example datasets you can use:
# 1. resources_servers/math_with_judge/data/example.jsonl (for testing)
# 2. SynthLabsAI/Big-Math-RL-Verified (Hugging Face dataset with difficulty metrics)
# 3. Your own custom math problems

# To use the example data for testing:
# data:
#   train_jsonl_fpath: "resources_servers/math_with_judge/data/example.jsonl"
#   validation_jsonl_fpath: "resources_servers/math_with_judge/data/aime24_validation.jsonl"
